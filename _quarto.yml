project:
  type: website
  pre-render: scripts/check-materials.py
  render:
    - "*.qmd"
    - "avvisi/*.md"
    - "!slides/"
    - "!ModelloLineare.qmd"
  resources:
    - "files/"

execute:
  freeze: auto # Re-render only when source changes

lang: it

bibliography: files/bib/references.bib
csl: files/bib/chicago-author-date.csl
description-meta: "Econometria - Giuseppe Ragusa - Sapienza"

website:
  title: "Econometria"
  site-url: "https://gragusa.org/econometria/"
  site-path: "/econometria/"
  favicon: "/files/icon-512.png"
  navbar:
    title: "Econometria"
    right:
      - text: "Avvisi"
        href: avvisi.qmd
      - syllabus.qmd
      - text: "Materiale didattico"
        file: materiale.qmd
      - icon: rss
        href: avvisi.xml
        aria-label: "Feed RSS degli avvisi"

  page-footer:
    left: "Giuseppe Ragusa · Sapienza, Università di Roma"
    right: "[gragusa.org](https://gragusa.org)"

format:
  academic-html:
    email-obfuscation: javascript
    # Course identity: the only two values that differ between course sites.
    include-in-header:
      text: |
        <style>:root { --course: #b95115; --course-mark: "EC"; }</style>
